name: clientops

services:
  db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: clientops
      POSTGRES_USER: clientops_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?required}
      RUNTIME_DATABASE_PASSWORD: ${RUNTIME_DATABASE_PASSWORD:?required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/001-clientops-roles.sh:ro
    networks:
      backend:
        ipv4_address: 172.28.1.4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientops_bootstrap -d clientops"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
        UV_IMAGE: ${UV_IMAGE}
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?required}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
        UV_IMAGE: ${UV_IMAGE}
    environment:
      APP_ENV: ${APP_ENV:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
      CSRF_HMAC_KEY: ${CSRF_HMAC_KEY:?required}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:?required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?required}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?required}
      PRIVATE_STORAGE_ROOT: /var/lib/clientops/private
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - private_files:/var/lib/clientops/private
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      edge:
        ipv4_address: 172.28.0.3
      backend:
        ipv4_address: 172.28.1.3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'Host':'api'}), timeout=3).read()",
        ]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      edge:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 3s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  pg_data:
  private_files:

networks:
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/28
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.1.0/28
