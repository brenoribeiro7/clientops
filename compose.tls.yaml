services:
  api:
    environment:
      APP_ENV: production
      PUBLIC_BASE_URL: https://web:8443
      TRUSTED_ORIGINS: https://web:8443

  web:
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./.local/tls:/run/clientops-tls:ro
      - ./infra/nginx/server-tls.conf:/etc/nginx/conf.d/server.conf:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--no-check-certificate",
          "-O",
          "/dev/null",
          "https://127.0.0.1:8443/login",
        ]
