root /usr/share/nginx/html;

location = /api/v1/health/ready {
    include /etc/nginx/snippets/headers-common.conf;
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Recurso não encontrado."}}';
}

location ^~ /api/ {
    include /etc/nginx/snippets/headers-common.conf;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /assets/ {
    include /etc/nginx/snippets/headers-common.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /q {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-public.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri @public_spa;
}

location ^~ /q/ {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-public.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri @public_spa;
}

location = /login {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-private.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri @private_spa;
}

location ~ ^/(admin|tech)(/|$) {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-private.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri @private_spa;
}

location ^~ /uploads/ {
    include /etc/nginx/snippets/headers-common.conf;
    return 404;
}

location ~ /\. {
    include /etc/nginx/snippets/headers-common.conf;
    return 404;
}

location @public_spa {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-public.conf;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
}

location @private_spa {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-private.conf;
    add_header Cache-Control "no-store" always;
    try_files /index.html =404;
}

location / {
    include /etc/nginx/snippets/headers-common.conf;
    include /etc/nginx/snippets/headers-private.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ @private_spa;
}
