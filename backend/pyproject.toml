[project]
name = "clientops-backend"
version = "0.1.0"
description = "ClientOps Foundation API"
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi>=25,<26",
  "email-validator>=2,<3",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires PostgreSQL 17",
  "compose: requires the Compose stack",
  "artifacts: inspects built artifacts and logs",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
